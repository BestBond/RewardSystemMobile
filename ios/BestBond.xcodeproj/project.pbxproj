			runOnlyForDeploymentPostprocessing = 0;
			shellPath = /bin/sh;
			shellScript = "set -e\nAPP_FW=\"${TARGET_BUILD_DIR}/${WRAPPER_NAME}/Frameworks\"\nSTAGING=\"${SRCROOT}/build\"\n# One destination only — copying dSYMs to 4 paths duplicated ~1GB+ per archive and caused \"No space left on device\".\n# When DWARF_DSYM_FOLDER_PATH is unset (common in Run Script), use the product dir (same place as BestBond.app.dSYM).\nSYM_OUT=\"${DWARF_DSYM_FOLDER_PATH}\"\n[ -n \"$SYM_OUT\" ] || SYM_OUT=\"${TARGET_BUILD_DIR}\"\nmkdir -p \"$SYM_OUT\"\nfor STAGED in \"${STAGING}/React.framework.dSYM\" \"${STAGING}/ReactNativeDependencies.framework.dSYM\" \"${STAGING}/hermesvm.framework.dSYM\"; do\n  if [ -d \"$STAGED\" ]; then\n    BNAME=$(basename \"$STAGED\")\n    rm -rf \"${SYM_OUT}/${BNAME}\"\n    cp -R \"$STAGED\" \"$SYM_OUT/\"\n  fi\ndone\nif [ -d \"$APP_FW\" ]; then\n  find \"$APP_FW\" -type d -name \"dSYMs\" 2>/dev/null | while IFS= read -r DDIR; do\n    case \"$DDIR\" in\n      *.framework/dSYMs)\n        for bundle in \"$DDIR\"/*.dSYM; do\n          [ -d \"$bundle\" ] || continue\n          BNAME=$(basename \"$bundle\")\n          rm -rf \"${SYM_OUT}/${BNAME}\"\n          cp -R \"$bundle\" \"$SYM_OUT/\"\n        done\n        rm -rf \"$DDIR\"\n        ;;\n    esac\n  done\nfi\n";
